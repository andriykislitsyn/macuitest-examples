[project]
name = "macuitest-examples"
version = "0.1.0"
description = "Example test suites driving real macOS apps with macuitest"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["macuitest>=0.11.0"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "preserve"
